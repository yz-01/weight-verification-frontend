# Browser regression suite (Playwright) for the six MSE Trace roles.
#
# Boots the real Django API against a disposable Postgres and the Next.js
# dev server, then drives Chromium through sign-in, portal isolation,
# no-reload navigation and 390px mobile checks.
#
# Needs one repository secret: BACKEND_REPO_TOKEN — a fine-grained PAT with
# read access to the backend repository, so this workflow can check it out.
# Without the secret the job skips with a notice instead of failing, so the
# suite can land before the token is provisioned.

name: E2E

on:
  push:
    branches: [develop, deploy]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKEND_TOKEN: ${{ secrets.BACKEND_REPO_TOKEN }}
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      E2E_POSTGRES_DB: weightverification_e2e
      E2E_BACKEND_DIR: ${{ github.workspace }}/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: weightverification_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Decide whether the backend token is available
        id: gate
        run: |
          if [ -z "$BACKEND_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::BACKEND_REPO_TOKEN is not set; skipping the E2E suite."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out frontend
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Check out backend
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: yz-01/weight-verification-backend
          # The integration branch, stated explicitly: the backend repo's
          # default branch is deploy, which trails develop and once shipped
          # a checkout without the seed command the suite depends on.
          ref: develop
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: backend

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # WeasyPrint links against system pango/cairo at import time in the
      # export helpers; the same libraries the backend CI installs.
      - name: Install WeasyPrint system libraries
        if: steps.gate.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 \
            libgdk-pixbuf-2.0-0 libharfbuzz0b fonts-noto-cjk

      - name: Install backend dependencies
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r backend/requirements.txt

      - name: Set up Node
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        if: steps.gate.outputs.skip != 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.gate.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run the E2E suite
        if: steps.gate.outputs.skip != 'true'
        run: npx playwright test

      - name: Upload report and traces
        if: steps.gate.outputs.skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
